name: Build Firefox for Windows

on:
  push:
    branches:
      - main
      - master
      - claude/exciting-mccarthy-o2x8zn
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  MOZ_NO_PROMPT: 1
  MAR_CHANNEL: ds-firefox
  # Repository whose releases serve updates. Override with the RELEASE_REPO
  # repository variable to publish to a separate (for example public) repo;
  # that needs a RELEASE_TOKEN secret with write access to it.
  RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}

jobs:
  windows:
    name: Windows x86_64 (cross-compiled on Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Install cross-compile host dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 lib32gcc-s1 msitools xz-utils python3-venv
          rustup target add x86_64-pc-windows-msvc

      - name: Write mozconfig
        run: |
          UPDATE_URL="https://github.com/${RELEASE_REPO}/releases/latest/download/update.xml"
          echo "UPDATE_URL=$UPDATE_URL" >> "$GITHUB_ENV"
          cat > "$GITHUB_WORKSPACE/mozconfig" <<MOZ
          ac_add_options --enable-project=browser
          ac_add_options --target=x86_64-pc-windows-msvc
          ac_add_options --disable-tests
          ac_add_options --disable-debug
          ac_add_options --enable-optimize
          ac_add_options --disable-debug-symbols
          ac_add_options --disable-maintenance-service
          ac_add_options --with-app-update-url=$UPDATE_URL
          export MAR_CHANNEL_ID=$MAR_CHANNEL
          export ACCEPTED_MAR_CHANNEL_IDS=$MAR_CHANNEL
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-win64
          MOZ
          cat "$GITHUB_WORKSPACE/mozconfig"
          echo "MOZCONFIG=$GITHUB_WORKSPACE/mozconfig" >> "$GITHUB_ENV"

      - name: Bootstrap toolchains
        run: ./mach --no-interactive bootstrap --application-choice browser

      - name: Configure (downloads the Windows SDK and MSVC runtime)
        run: ./mach configure

      - name: Build
        run: ./mach build

      - name: Package
        run: |
          ./mach package
          df -h /
          ls -la obj-win64/dist/*.installer.exe

      - name: Check update settings in the build
        run: |
          grep -A1 '^\[AppUpdate\]' obj-win64/dist/bin/application.ini
          grep -q "URL=$UPDATE_URL" obj-win64/dist/bin/application.ini
          cat obj-win64/dist/bin/update-settings.ini
          grep -q "ACCEPTED_MAR_CHANNEL_IDS=$MAR_CHANNEL" obj-win64/dist/bin/update-settings.ini

      - name: Release info
        id: info
        run: |
          BUILD_ID=$(sed -n 's/^BuildID=//p' obj-win64/dist/bin/application.ini | head -1)
          VERSION=$(sed -n 's/^Version=//p' obj-win64/dist/bin/application.ini | head -1)
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=build-$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Create signed update package
        id: mar
        env:
          MAR_SIGNING_KEY: ${{ secrets.MAR_SIGNING_KEY }}
        run: |
          if [ -z "$MAR_SIGNING_KEY" ]; then
            echo "::warning::MAR_SIGNING_KEY secret is not set; the release will not include an update package."
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/marvenv"
          "$RUNNER_TEMP/marvenv/bin/pip" install --quiet "mar==3.2.1"
          KEY="$RUNNER_TEMP/mar-signing-key.pem"
          ( umask 077; printf '%s\n' "$MAR_SIGNING_KEY" > "$KEY" )
          export MAR_TOOL="$RUNNER_TEMP/marvenv/bin/mar"
          export MAR_SIGNING_KEY_FILE="$KEY"

          BUILD_ID="${{ steps.info.outputs.build_id }}"
          VERSION="${{ steps.info.outputs.version }}"
          TAG="${{ steps.info.outputs.tag }}"
          MAR="obj-win64/dist/firefox-$VERSION-$BUILD_ID.complete.mar"
          ./mach repackage mar --input obj-win64/dist/firefox-*.win64.zip --mar "$PWD/tools/ds_firefox/signed-mar.sh" \
            --output "$MAR" --arch x86_64 --mar-channel-id "$MAR_CHANNEL"
          rm -f "$KEY"

          openssl x509 -inform DER -in toolkit/mozapps/update/updater/ds_firefox_primary.der \
            -pubkey -noout > "$RUNNER_TEMP/mar-signing-pub.pem"
          "$RUNNER_TEMP/marvenv/bin/mar" -v "$MAR" -k "$RUNNER_TEMP/mar-signing-pub.pem"
          "$RUNNER_TEMP/marvenv/bin/mar" -T "$MAR" > "$RUNNER_TEMP/mar-listing.txt"
          head -n 8 "$RUNNER_TEMP/mar-listing.txt"

          SIZE=$(stat -c %s "$MAR")
          HASH=$(sha512sum "$MAR" | cut -d' ' -f1)
          MAR_URL="https://github.com/${RELEASE_REPO}/releases/download/$TAG/$(basename "$MAR")"
          cat > obj-win64/dist/update.xml <<XML
          <?xml version="1.0"?>
          <updates>
            <update type="minor" displayVersion="$VERSION" appVersion="$VERSION" platformVersion="$VERSION" buildID="$BUILD_ID" detailsURL="https://github.com/${RELEASE_REPO}/releases/tag/$TAG">
              <patch type="complete" URL="$MAR_URL" size="$SIZE" hashFunction="sha512" hashValue="$HASH"/>
            </update>
          </updates>
          XML
          cat obj-win64/dist/update.xml
          echo "mar=$MAR" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
          MAR: ${{ steps.mar.outputs.mar }}
        run: |
          shopt -s nullglob
          FILES=(obj-win64/dist/*.installer.exe)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No installer to publish."
            exit 1
          fi
          NOTES="Windows x86_64 build of $GITHUB_SHA. Run the installer .exe to install."
          if [ -n "$MAR" ] && [ -f "$MAR" ]; then
            FILES+=("$MAR" obj-win64/dist/update.xml)
            NOTES="$NOTES Installed builds update to this release silently."
          else
            NOTES="$NOTES This release has no update package because the MAR_SIGNING_KEY secret was not set."
          fi
          printf 'Publishing: %s\n' "${FILES[@]}"
          TARGET=()
          if [ "$RELEASE_REPO" = "$GITHUB_REPOSITORY" ]; then
            TARGET=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "${FILES[@]}" --repo "$RELEASE_REPO" "${TARGET[@]}" \
            --title "ds_firefox $VERSION ($TAG)" --latest --notes "$NOTES"
